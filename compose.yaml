services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vetglobal
      POSTGRES_USER: vetglobal
      POSTGRES_PASSWORD: vetglobal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetglobal -d vetglobal"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://vetglobal:vetglobal@db:5432/vetglobal
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://vetglobal:vetglobal@db:5432/vetglobal
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      ALLOWED_FRONTEND_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: vetglobal_test
      POSTGRES_USER: vetglobal
      POSTGRES_PASSWORD: vetglobal
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetglobal -d vetglobal_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
